<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>чат — осенний чат</title>
    <style>
        /* ===== БЛОКИРОВКА РАСТЯГИВАНИЯ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        
        body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: none;
        }
        
        .messages-area {
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y pinch-zoom;
        }
        
        /* ===== БАЗОВЫЕ ПЕРЕМЕННЫЕ (осенняя тема) ===== */
        :root {
            --bg: #fef7e8;
            --surface: rgba(255,245,230,0.85);
            --border: #f0e0cc;
            --text: #4a3a2a;
            --text-light: #8b7355;
            --accent: #e8a87c;
            --accent-dark: #d48c5b;
            --bubble-friend: rgba(255,255,245,0.95);
            --bubble-user: #e8a87c;
            --bubble-user-text: #ffffff;
            --popup-bg: rgba(255,248,240,0.95);
            --popup-border: rgba(240,224,204,0.6);
            --popup-item-hover: rgba(240,224,204,0.5);
            --topbar-gradient: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,248,240,0.05));
            --input-gradient: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,250,245,0.6));
            --popup-gradient: linear-gradient(160deg, rgba(255,255,255,0.85), rgba(255,245,235,0.7));
            --settings-item-bg: rgba(255,255,255,0.45);
            --settings-item-hover: rgba(255,255,255,0.65);
            --leaf-opacity: 0.55;
            --leaf-color: #d4b48c;
        }

        /* ===== ГРАДИЕНТОВАЯ ТЕМА ===== */
        body.theme-gradient {
            --bg: linear-gradient(135deg, #f5e6ff, #ffe6f0);
            --surface: rgba(245, 230, 255, 0.7);
            --border: rgba(180, 130, 200, 0.3);
            --text: #3a2a4a;
            --text-light: #7a5a8a;
            --accent: #a855f7;
            --accent-dark: #9333ea;
            --bubble-friend: rgba(255, 255, 255, 0.9);
            --bubble-user: linear-gradient(135deg, #a855f7, #ec4899);
            --bubble-user-text: #ffffff;
            --popup-bg: rgba(255, 255, 255, 0.95);
            --popup-border: rgba(200, 180, 220, 0.4);
            --popup-item-hover: rgba(200, 180, 220, 0.3);
            --topbar-gradient: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(245, 230, 255, 0.05));
            --input-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(245, 230, 255, 0.7));
            --popup-gradient: linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(245, 230, 255, 0.7));
            --settings-item-bg: rgba(255, 255, 255, 0.6);
            --settings-item-hover: rgba(255, 255, 255, 0.8);
            --leaf-opacity: 0.0;
        }

        body {
            font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;
            height:100vh;
            display:flex;
            flex-direction:column;
            font-size:15px;
            overflow:hidden;
            background:var(--bg);
            transition:background 0.2s ease;
        }
        
        .leaf-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden;opacity:var(--leaf-opacity);transition:opacity 0.2s ease;}
        .leaf{position:absolute;font-size:48px;color:var(--leaf-color);filter:drop-shadow(0 3px 4px rgba(0,0,0,0.12));transition:color 0.2s ease;}
        .leaf:nth-child(1){top:5%;left:5%;transform:rotate(15deg)}
        .leaf:nth-child(2){top:15%;right:8%;transform:rotate(-25deg)}
        .leaf:nth-child(3){top:40%;left:3%;transform:rotate(35deg)}
        .leaf:nth-child(4){top:60%;right:10%;transform:rotate(-15deg)}
        .leaf:nth-child(5){top:75%;left:15%;transform:rotate(20deg)}
        .leaf:nth-child(6){top:88%;right:5%;transform:rotate(-30deg)}

        .messages-area{
            flex:1;
            overflow-y:auto;
            overflow-x:hidden;
            padding:80px 16px 110px;
            display:flex;
            flex-direction:column;
            gap:8px;
            background:var(--surface);
            backdrop-filter: blur(2px);
            position:relative;
            z-index:2;
            transition:background 0.2s ease;
            touch-action: pan-y;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 248, 240, 0.85);
            border-bottom: 0.5px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 12px 16px;
            padding-top: env(safe-area-inset-top, 12px);
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
            transition: background 0.2s ease;
            flex-direction: column;
            gap: 4px;
        }
        
        body.theme-gradient .top-bar {
            background: rgba(255, 255, 255, 0.85);
        }

        /* ===== ЧИСТАЯ КНОПКА БУРГЕР (БЕЗ ФОНА) ===== */
        .menu-btn {
            position: fixed;
            left: 16px;
            top: calc(env(safe-area-inset-top, 12px) + 8px);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s;
            background: transparent;
            border: none;
            backdrop-filter: none;
            border-radius: 0;
        }
        .menu-btn:active {
            transform: scale(0.92);
        }
        .menu-btn svg {
            width: 28px;
            height: 28px;
            stroke: var(--text);
            stroke-width: 2.5;
            fill: none;
        }

        .room-info {
            text-align: center;
        }
        .room-name {
            font-size: 16px;
            font-weight: 590;
            color: var(--text);
            display: inline-block;
            background: rgba(142,154,175,0.1);
            padding: 6px 12px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .room-meta {
            font-size: 10px;
            color: var(--text-light);
            text-align: center;
        }
        .room-prompt {
            font-size: 11px;
            color: var(--accent-dark);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        
        /* ===== БОКОВАЯ ШТОРКА ===== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.2, 0.95, 0.4, 1), visibility 0.35s cubic-bezier(0.2, 0.95, 0.4, 1);
        }
        .drawer-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            max-width: 85%;
            height: 100%;
            background: var(--popup-bg);
            backdrop-filter: blur(25px);
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            box-shadow: none;
            border-right: 0.5px solid var(--popup-border);
        }
        .drawer.open {
            transform: translateX(0);
        }
        
        .drawer-header {
            padding: 24px 20px 16px;
            border-bottom: 0.5px solid var(--popup-border);
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            background: rgba(255,255,255,0.05);
            padding-top: max(24px, env(safe-area-inset-top, 20px));
        }
        
        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 20px;
        }
        
        .drawer-section {
            margin: 8px 0;
        }
        
        .drawer-section-title {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }
        
        .drawer-item {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
            margin: 2px 8px;
            border-radius: 14px;
            background: var(--settings-item-bg);
        }
        .drawer-item:active {
            background: var(--settings-item-hover);
        }
        
        .drawer-label {
            font-size: 15px;
            color: var(--text);
            font-weight: 500;
        }
        
        .drawer-input {
            background: rgba(0,0,0,0.05);
            border: 0.5px solid var(--popup-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text);
            outline: none;
            width: 100%;
            text-align: left;
            transition: border 0.15s;
        }
        .drawer-input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.7);
        }
        
        .drawer-btn {
            background: var(--accent);
            border: none;
            border-radius: 12px;           
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            text-align: center;
            width: 100%;
            letter-spacing: 0.3px;
        }
        .drawer-btn:active {
            transform: scale(0.97);
            background: var(--accent-dark);
        }
        
        .drawer-danger {
            color: #ff6b6b !important;
            font-weight: 500;
        }
        
        .theme-switchers-drawer {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px;
            border-radius: 32px;
        }
        .theme-option-drawer {
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
            background: transparent;
            text-align: center;
        }
        .theme-option-drawer.active[data-theme="autumn"] {
            background: #e8a87c;
            color: white;
        }
        .theme-option-drawer.active[data-theme="gradient"] {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
        }
        
        .font-controls-drawer {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .font-btn-drawer {
            background: rgba(0,0,0,0.06);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 34px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .font-btn-drawer:active {
            background: var(--accent);
            color: #fff;
        }
        .font-size-value-drawer {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            min-width: 40px;
            text-align: center;
        }
        
        .drawer-info-text {
            padding: 12px 20px;
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            border-top: 0.5px solid var(--popup-border);
            margin-top: auto;
        }
        
        .empty-chat {
            display: none;
        }
        .messages-area:empty::before {
            content: "";
            display: block;
            height: 100%;
        }

        .input-panel {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: box-shadow 0.2s;
            backdrop-filter: blur(8px);
        }
        
        body.theme-gradient .input-panel {
            background: rgba(255, 255, 255, 0.9);
        }
        
        .input-panel:focus-within {
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
        }
        
        .reply-preview, .image-preview {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(0,0,0,0.03);
            border-radius: 20px;
            margin: 6px 6px 0 6px;
        }
        .reply-preview.show, .image-preview.show { display: flex; }
        
        .reply-preview-bar {
            width: 3px;
            height: 36px;
            background: var(--accent);
            border-radius: 2px;
            flex-shrink: 0;
        }
        
        .reply-preview-info, .image-preview-info { flex: 1; min-width: 0; padding-left: 4px; }
        .reply-preview-name { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 1px; }
        .reply-preview-text, .image-preview-text { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-preview-close, .image-preview-close { background: transparent; border: none; color: var(--text-light); cursor: pointer; font-size: 18px; padding: 4px; line-height: 1; flex-shrink: 0; }
        .image-preview-thumb { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 8px 12px 8px 12px;
            padding-bottom: max(8px, env(safe-area-inset-bottom, 0px) + 8px);
        }
        .input-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: transparent;
        }
        .chat-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            padding: 8px 0;
            outline: none;
            color: var(--text);
            resize: none;
            font-family: inherit;
            line-height: 1.4;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow-y: auto;
            max-height: 120px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .chat-input::-webkit-scrollbar { display: none; }
        .chat-input::placeholder { color: var(--text-light); opacity: 0.6; }
        
        .attach-btn, .send-action {
            background: transparent;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.15s;
        }
        .attach-btn:active, .send-action:active { transform: scale(0.92); }
        .attach-btn svg { width: 22px; height: 22px; stroke: var(--text-light); stroke-width: 1.8; }
        .attach-btn.has-image { background: var(--accent); }
        .attach-btn.has-image svg { stroke: white; }
        .send-action {
            background: var(--accent);
            box-shadow: 0 2px 8px rgba(232, 168, 124, 0.3);
        }
        .send-action:active { background: var(--accent-dark); }
        .send-action svg { width: 20px; height: 20px; stroke: white; stroke-width: 2.5; }
        #fileInput { display: none; }
        
        .message-row {
            display: flex;
            position: relative;
            align-items: flex-end;
            max-width: 82%;
            animation: fadeIn 0.15s;
            touch-action: pan-y;
            user-select: none;
            overflow: visible;
        }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; margin-left: auto; }
        .message-row.friend { align-self: flex-start; margin-right: auto; }
        .message-content { display: flex; flex-direction: column; max-width: 100%; position: relative; z-index: 1; }
        .user .message-content { align-items: flex-end; }
        .friend .message-content { align-items: flex-start; }
        .swipe-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: -52px;
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .user .swipe-icon { left: auto; right: -52px; }
        .swipe-icon svg { width: 20px; height: 20px; stroke: white; stroke-width: 2; fill: none; }
        
        .bubble {
            padding: 12px 18px;
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
            max-width: 100%;
            width: fit-content;
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.02);
            transition: background 0.2s ease, color 0.2s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .bubble:active { transform: scale(0.98); }
        .friend .bubble {
            background: var(--bubble-friend);
            color: var(--text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border);
        }
        .user .bubble {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        
        .bubble-image-container {
            padding: 4px;
            max-width: 200px;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .bubble-image-container img {
            width: 100%;
            display: block;
            cursor: pointer;
            border-radius: 14px 14px 0 0;
            margin-bottom: -1px;
        }
        .bubble-image-container img:active { transform: scale(0.98); }
        .bubble-image-container .bubble-image-text {
            padding: 6px 10px 4px 10px;
            font-size: 16px;
            line-height: 1.4;
            word-break: break-word;
            border-radius: 0 0 14px 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user .bubble-image-container .bubble-image-text {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
        }
        .friend .bubble-image-container .bubble-image-text {
            background: var(--bubble-friend);
            color: var(--text);
            border: 1px solid var(--border);
            border-top: none;
        }
        
        .reply-attachment {
            background: rgba(0,0,0,0.04);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            max-width: 100%;
            overflow: hidden;
            cursor: pointer;
        }
        .reply-attachment-name { font-weight: 600; color: var(--accent); margin-bottom: 2px; }
        .reply-attachment-text { color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .message-meta {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
            display: flex;
            gap: 8px;
            font-weight: 500;
        }
        .user .message-meta { justify-content: flex-end; }
        .friend .message-meta { justify-content: flex-start; }
        
        .message-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
            background: transparent;
            padding: 0;
            border: none;
        }
        .user .message-actions { right: calc(100% + 8px); left: auto; }
        .friend .message-actions { left: calc(100% + 8px); right: auto; }
        .message-row:hover .message-actions,
        .message-row .message-actions.active { opacity: 1; visibility: visible; }
        
        .action-dots-btn {
            background: var(--accent);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .action-dots-btn:active { transform: scale(0.9); background: var(--accent-dark); }
        .action-dots-btn svg { width: 18px; height: 18px; stroke: white; stroke-width: 2.5; fill: none; stroke-linecap: round; }
        
        .action-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .action-modal-overlay.show { opacity: 1; visibility: visible; }
        .action-modal-card {
            background: var(--popup-bg);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 0;
            width: 220px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            border: 0.5px solid var(--popup-border);
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
        }
        .action-modal-overlay.show .action-modal-card { transform: scale(1); }
        .action-modal-item {
            padding: 16px 24px;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: center;
            transition: background 0.1s;
            font-weight: 500;
            width: 100%;
            display: block;
            border-bottom: 0.5px solid var(--popup-border);
        }
        .action-modal-item:last-child { border-bottom: none; }
        .action-modal-item:active { background: var(--popup-item-hover); }
        .action-modal-item.danger { color: #ff6b6b; }
        
        .confirm-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

function showDel(id) { if (!id) return; pendingDelId = id; confirmPopup.classList.add('show'); }
function hideDel() { confirmPopup.classList.remove('show'); pendingDelId = null; }
async function delMsg() { if (!pendingDelId || !currentRoom) { hideDel(); return; } try { const s = await get(ref(database, `rooms/${currentRoom}/messages/${pendingDelId}`)); const m = s.val(); if (!m) { hideDel(); return; } if (m.userName !== currentName) { alert('Вы можете удалять только свои сообщения'); hideDel(); return; } } catch(e) { hideDel(); return; } try { await remove(ref(database, `rooms/${currentRoom}/messages/${pendingDelId}`)); } catch(e) { console.error(e); alert('не удалось удалить'); } hideDel(); }
confirmYes.addEventListener('click', delMsg); confirmYes.addEventListener('touchend', (e) => { e.preventDefault(); delMsg(); });
confirmNo.addEventListener('click', hideDel); confirmNo.addEventListener('touchend', (e) => { e.preventDefault(); hideDel(); });

function updateUIForAuth() {
    if (currentName && currentRoom) {
        roomNameSpan.textContent = `#${currentRoom}`;
        roomStatusSpan.textContent = `вы как ${currentName}`;
        roomPrompt.style.display = 'none';
        exitSection.style.display = 'block';
    } else {
        roomNameSpan.textContent = 'чат';
        roomStatusSpan.textContent = '';
        roomPrompt.style.display = 'block';
        exitSection.style.display = 'none';
    }
}

function enterChat() { 
    const n = drawerNameInput.value.trim(), r = drawerRoomInput.value.trim(); 
    if (!n || !r) { alert('введите ник и название пространства'); return; } 
    currentName = n; 
    currentRoom = r; 
    localStorage.setItem('last_name', n); 
    localStorage.setItem('last_room', r); 
    updateUIForAuth();
    closeDrawer();
    loadMsgs(); 
    messageInput.focus(); 
    autoResizeTextarea(); 
}

async function exitChat() { 
    hideDel();
    if (messagesListener) { messagesListener(); messagesListener = null; }
    cancelEdit(); cancelReply(); cancelImage(); 
    currentRoom = null; currentName = null; 
    messagesCache = {}; 
    messagesArea.innerHTML = ''; 
    updateUIForAuth();
    drawerNameInput.value = '';
    drawerRoomInput.value = '';
    messageInput.value = ''; 
    autoResizeTextarea(); 
    openDrawer();
}

drawerJoinBtn.onclick = enterChat;
exitDrawerBtn.onclick = async () => { await exitChat(); };

async function sendMessage(text, imageData) { if (!currentRoom || !currentName) { alert('сначала войдите в чат'); openDrawer(); return false; } const nm = { userName: currentName, time: new Date().toISOString(), type: imageData ? 'image' : 'text', text: text || '', ...(imageData && { data: imageData }) }; if (replyTo) nm.replyTo = replyTo; try { await push(ref(database, `rooms/${currentRoom}/messages`), nm); cancelReply(); cancelImage(); return true; } catch(e) { alert('ошибка отправки'); return false; } }

async function sendOrSave() { 
    if (isSending) return; 
    if (!currentRoom || !currentName) { alert('сначала войдите в чат'); openDrawer(); return; } 
    if (editingId) { await saveEdit(); return; } 
    const t = messageInput.value.trim();
    if (!t && !pendingImage) return; 
    if (t.length > 15000) { alert('сообщение не длиннее 15000 символов'); return; } 
    isSending = true; 
    let ok = false;
    if (pendingImage) ok = await sendMessage(t, pendingImage.data);
    else ok = await sendMessage(t, null);
    isSending = false; 
    if (ok) { messageInput.value = ''; autoResizeTextarea(); shouldScroll = true; scrollToBottom(); } 
}

function applyFont() { 
    document.body.style.fontSize = fontSize + 'px'; 
    messageInput.style.fontSize = fontSize + 'px'; 
    document.querySelectorAll('.bubble').forEach(el => el.style.fontSize = fontSize + 'px'); 
    document.querySelectorAll('.bubble-image-text').forEach(el => el.style.fontSize = fontSize + 'px'); 
    document.getElementById('fontSizeValueDrawer').textContent = fontSize; 
    localStorage.setItem('font_size', fontSize); 
    autoResizeTextarea(); 
}
function loadSettings() { 
    const sf = localStorage.getItem('font_size'); 
    if (sf) { fontSize = parseInt(sf); fontSize = Math.min(18, Math.max(12, fontSize)); } else fontSize = 15; 
    applyFont(); 
}

document.getElementById('fontMinusDrawer').onclick = () => { fontSize = Math.max(12, fontSize - 1); applyFont(); }; 
document.getElementById('fontPlusDrawer').onclick = () => { fontSize = Math.min(18, fontSize + 1); applyFont(); };
sendBtn.onclick = () => sendOrSave(); attachBtn.onclick = () => fileInput.click();
messageInput.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (messageInput.value.trim() || editingId || pendingImage) sendOrSave(); } });
imageViewerClose.onclick = closeViewer; imageViewer.onclick = e => { if (e.target === imageViewer) closeViewer(); };
function closeViewer() { imageViewer.classList.remove('show'); document.body.style.overflow = ''; }
function openViewer(url) { imageViewerImg.src = url; imageViewer.classList.add('show'); document.body.style.overflow = 'hidden'; }
document.onkeydown = e => { if (e.key === 'Escape') { if (imageViewer.classList.contains('show')) closeViewer(); else if (editingId) cancelEdit(); else if (replyTo) cancelReply(); else if (pendingImage) cancelImage(); else if (actionModal.classList.contains('show')) { actionModal.classList.remove('show'); pendingActionId = null; } else closeDrawer(); } };

document.addEventListener('DOMContentLoaded', () => { 
    const ln = localStorage.getItem('last_name'), lr = localStorage.getItem('last_room'); 
    if (ln && lr) { 
        drawerNameInput.value = ln; 
        drawerRoomInput.value = lr; 
        enterChat(); 
    } else { 
        messagesArea.innerHTML = ''; 
        updateUIForAuth();
        openDrawer();
    } 
});
loadSettings(); messageInput.addEventListener('input', autoResizeTextarea); autoResizeTextarea();

// Исправленная система скролла
let touchStartYScrollGlobal = 0;
messagesArea.addEventListener('touchstart', (e) => {
    touchStartYScrollGlobal = e.touches[0].clientY;
}, { passive: true });

messagesArea.addEventListener('touchmove', (e) => {
    const scrollTop = messagesArea.scrollTop;
    const scrollHeight = messagesArea.scrollHeight;
    const clientHeight = messagesArea.clientHeight;
    const currentY = e.touches[0].clientY;
    const deltaY = currentY - touchStartYScrollGlobal;
    
    if ((scrollTop === 0 && deltaY > 0) || (scrollTop + clientHeight >= scrollHeight && deltaY < 0)) {
        e.preventDefault();
    }
}, { passive: false });

let zoomScale = 1, startDist = 0, tx = 0, ty = 0, startX = 0, startY = 0;
function updateZoom() { const img = document.getElementById('imageViewerImg'); if (img) img.style.transform = `translate(${tx}px, ${ty}px) scale(${zoomScale})`; }
const viewerElement = document.getElementById('imageViewer');
viewerElement.addEventListener('touchstart', e => { if (e.touches.length === 2) { startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } else if (e.touches.length === 1 && zoomScale > 1) { startX = e.touches[0].clientX - tx; startY = e.touches[0].clientY - ty; } });
viewerElement.addEventListener('touchmove', e => { if (e.touches.length === 2 && startDist) { e.preventDefault(); let newScale = zoomScale * (Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / startDist); zoomScale = Math.min(3, Math.max(1, newScale)); updateZoom(); } else if (e.touches.length === 1 && zoomScale > 1) { e.preventDefault(); tx = e.touches[0].clientX - startX; ty = e.touches[0].clientY - startY; updateZoom(); } });
viewerElement.addEventListener('touchend', () => { if (zoomScale < 1.1) { zoomScale = 1; tx = 0; ty = 0; updateZoom(); } });
const oldCloseViewer = closeViewer;
closeViewer = () => { zoomScale = 1; tx = 0; ty = 0; updateZoom(); oldCloseViewer(); };
</script>
</body>
</html>
