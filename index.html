<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы | Чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* карточка — дизайн сохранён */
        .card {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #e2e8f0;
        }

        /* иконка */
        .icon {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: #3b82f6;
        }

        /* заголовок: Технические + работы (две строки) */
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            color: #0f172a;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        /* нижняя строка "работы" можно сделать чуть иначе, но оставляем как текст */
        /* специально разбиваем, чтобы было как "Технические" и ниже "работы" */
        .title-line {
            display: block;
        }

        /* блок с текстом "В чате идут технические работы." */
        .main-text {
            text-align: center;
            font-size: 1rem;
            color: #334155;
            padding-bottom: 0;
            margin-top: 0.75rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">
        🛠️
    </div>
    <h1>
        Технические<br>работы
    </h1>
    <div class="main-text">
        В чате идут технические работы.
    </div>
</div>

</body>
</html>
