<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>воздушный чат</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        
        /* ===== ТОЛЬКО КЛАССИЧЕСКАЯ ТЕМА ===== */
        :root{
            --bg: #fef7e8;
            --surface: rgba(255,245,230,0.85);
            --border: #f0e0cc;
            --text: #4a3a2a;
            --text-light: #8b7355;
            --accent: #e8a87c;
            --accent-dark: #d48c5b;
            --bubble-friend: rgba(255,255,245,0.95);
            --bubble-user: #e8a87c;
            --popup-bg: rgba(255,248,240,0.85);
            --popup-border: rgba(240,224,204,0.6);
            --popup-item-hover: rgba(240,224,204,0.5);
            --topbar-gradient: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,248,240,0.5));
            --input-gradient: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,250,245,0.6));
            --popup-gradient: linear-gradient(160deg, rgba(255,255,255,0.85), rgba(255,245,235,0.7));
            --settings-item-bg: rgba(255,255,255,0.45);
            --settings-item-hover: rgba(255,255,255,0.65);
            --leaf-opacity: 0.55;
            --leaf-color: #d4b48c;
            --wave-gradient: linear-gradient(135deg, #7c3aed, #4d6bfe);
        }

        body{font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;font-size:15px;overflow:hidden;background:var(--bg);transition:background 0.3s ease;}
        
        .leaf-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden;opacity:var(--leaf-opacity);transition:opacity 0.5s ease;}
        .leaf{position:absolute;font-size:48px;color:var(--leaf-color);filter:drop-shadow(0 3px 4px rgba(0,0,0,0.12));transition:color 0.3s ease;}
        .leaf:nth-child(1){top:3%;left:2%;transform:rotate(15deg)}.leaf:nth-child(2){top:8%;right:5%;transform:rotate(-25deg)}.leaf:nth-child(3){top:18%;left:15%;transform:rotate(35deg)}.leaf:nth-child(4){top:25%;right:20%;transform:rotate(-10deg)}.leaf:nth-child(5){top:35%;left:8%;transform:rotate(45deg)}.leaf:nth-child(6){top:42%;right:12%;transform:rotate(-35deg)}.leaf:nth-child(7){top:50%;left:25%;transform:rotate(20deg)}.leaf:nth-child(8){top:55%;right:30%;transform:rotate(-45deg)}.leaf:nth-child(9){top:62%;left:5%;transform:rotate(10deg)}.leaf:nth-child(10){top:68%;right:8%;transform:rotate(-20deg)}.leaf:nth-child(11){top:75%;left:18%;transform:rotate(30deg)}.leaf:nth-child(12){top:82%;right:22%;transform:rotate(-15deg)}.leaf:nth-child(13){top:88%;left:35%;transform:rotate(40deg)}.leaf:nth-child(14){top:92%;right:40%;transform:rotate(-30deg)}.leaf:nth-child(15){top:12%;left:45%;transform:rotate(5deg)}.leaf:nth-child(16){top:45%;left:60%;transform:rotate(-50deg)}.leaf:nth-child(17){top:70%;left:70%;transform:rotate(25deg)}.leaf:nth-child(18){top:30%;right:45%;transform:rotate(-5deg)}

        .messages-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:80px 16px 110px;display:flex;flex-direction:column;gap:8px;background:var(--surface);backdrop-filter: blur(2px);position:relative;z-index:2;transition:background 0.3s ease;}
        .top-bar{position:fixed;top:0;left:0;right:0;background:var(--topbar-gradient);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:10;padding:12px 16px;padding-top:env(safe-area-inset-top,12px);box-shadow:0 1px 8px rgba(0,0,0,0.04);transition:background 0.3s ease;}
        .input-panel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:600px;background:var(--input-gradient);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,0.08),0 0 0 0.5px rgba(255,255,255,0.3) inset;display:flex;flex-direction:column;z-index:10;transition:box-shadow 0.2s}
        .input-panel:focus-within{box-shadow:0 6px 24px rgba(0,0,0,0.12),0 0 0 0.5px rgba(255,255,255,0.4) inset}
        .reply-preview,.image-preview{display:none;align-items:center;gap:6px;padding:8px 10px;background:rgba(0,0,0,0.03);border-radius:20px;margin:6px 6px 0 6px}
        .reply-preview.show,.image-preview.show{display:flex}
        .reply-preview-icon{width:28px;height:28px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .reply-preview-icon svg{width:14px;height:14px;stroke:white;stroke-width:2.5;fill:none}
        .reply-preview-info,.image-preview-info{flex:1;min-width:0}
        .reply-preview-name{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:1px}
        .reply-preview-text,.image-preview-text{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .reply-preview-close,.image-preview-close{background:transparent;border:none;color:var(--text-light);cursor:pointer;font-size:18px;padding:4px;line-height:1;flex-shrink:0}
        .image-preview-thumb{width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0}
        .input-row{display:flex;gap:8px;align-items:center;padding:8px 12px 8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px) + 8px)}
        .input-wrapper{flex:1;overflow:hidden;position:relative}
        .chat-input{width:100%;border:none;background:transparent;font-size:15px;padding:8px 0;outline:none;color:var(--text);resize:none;font-family:inherit;line-height:1.4;scrollbar-width:none;-ms-overflow-style:none;overflow-y:auto;max-height:120px}
        .chat-input::-webkit-scrollbar{display:none}
        .chat-input::placeholder{color:var(--text-light);opacity:0.6}
        .room-info{flex:1;cursor:pointer}
        .room-name{font-size:16px;font-weight:590;color:var(--text);display:inline-flex;align-items:center;gap:4px;background:rgba(142,154,175,0.1);padding:6px 12px;border-radius:30px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.room-name:active{background:var(--border);transform:scale(0.96)}.room-name::after{content:'⌵';font-size:12px;opacity:0.5}
        .room-meta{font-size:10px;color:var(--text-light);margin-top:2px;margin-left:12px}
        .header-buttons{display:flex;gap:4px}
        .icon-btn{background:rgba(142,154,175,0.1);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.icon-btn:active{background:var(--border);transform:scale(0.94)}.icon-btn svg{width:18px;height:18px;stroke:var(--text-light);stroke-width:1.5;fill:none}
        .attach-btn,.send-action{background:transparent;border:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background 0.15s,transform 0.15s}
        .attach-btn:active,.send-action:active{transform:scale(0.92)}
        .attach-btn svg{width:20px;height:20px;stroke:var(--text-light);stroke-width:1.8}
        .attach-btn.has-image{background:var(--accent)}
        .attach-btn.has-image svg{stroke:white}
        .send-action{background:var(--accent);box-shadow:0 2px 8px rgba(139,195,74,0.3)}
        .send-action:active{background:var(--accent-dark)}
        .send-action svg{width:18px;height:18px;stroke:white;stroke-width:2.5}
        #fileInput{display:none}
        .message-row{display:flex;position:relative;align-items:flex-end;max-width:82%;animation:fadeIn 0.15s;touch-action:pan-y;user-select:none;overflow:visible}
        .message-row.user{align-self:flex-end;flex-direction:row-reverse;margin-left:auto}
        .message-row.friend{align-self:flex-start;margin-right:auto}
        .message-content{display:flex;flex-direction:column;max-width:100%;position:relative;z-index:1}
        .user .message-content{align-items:flex-end}.friend .message-content{align-items:flex-start}
        .swipe-icon{position:absolute;top:50%;transform:translateY(-50%);left:-52px;width:36px;height:36px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:0;box-shadow:0 2px 6px rgba(0,0,0,0.2)} .user .swipe-icon{left:auto;right:-52px} .swipe-icon svg{width:20px;height:20px;stroke:white;stroke-width:2;fill:none}
        
        .bubble{
            padding:12px 18px;
            font-size:16px;
            line-height:1.5;
            word-break:break-word;
            max-width:100%;
            width:fit-content;
            display:inline-block;
            border-radius:20px;
            box-shadow:0 2px 12px rgba(0,0,0,0.06);
            border:1px solid rgba(0,0,0,0.02);
            transition:background 0.3s ease, color 0.3s ease;
        }
        .bubble:active{transform:scale(0.98)}
        .friend .bubble{
            background:var(--bubble-friend);
            color:var(--text);
            border-bottom-left-radius:6px;
            border:1px solid var(--border);
        }
        .user .bubble{
            background:var(--bubble-user);
            color:#ffffff;
            border-bottom-right-radius:6px;
            box-shadow:0 2px 12px rgba(139,195,74,0.25);
        }

        .bubble-image{padding:4px;max-width:200px;border-radius:18px;background:transparent;position:relative}.bubble-image img{width:100%;border-radius:14px;display:block;cursor:pointer}.bubble-image img:active{transform:scale(0.98)}
        .bubble-image .bubble-text-below{padding:6px 10px 4px 10px;font-size:16px;line-height:1.4;word-break:break-word;border-bottom-left-radius:14px;border-bottom-right-radius:14px}
        .user .bubble-image .bubble-text-below{background:var(--bubble-user);color:#fff;border-bottom-left-radius:14px;border-bottom-right-radius:14px;}.friend .bubble-image .bubble-text-below{background:var(--bubble-friend);color:var(--text);border-bottom-left-radius:14px;border-bottom-right-radius:14px;border:1px solid var(--border);border-top:none;}
        .reply-attachment{background:rgba(0,0,0,0.04);border-left:3px solid var(--accent);padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:12px;max-width:100%;overflow:hidden;cursor:pointer}
        .reply-attachment-name{font-weight:600;color:var(--accent);margin-bottom:2px}
        .reply-attachment-text{color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .message-meta{font-size:11px;color:var(--text-light);margin-top:4px;display:flex;gap:8px;font-weight:500;}.user .message-meta{justify-content:flex-end}.friend .message-meta{justify-content:flex-start}
        
        .message-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s, visibility 0.15s;
            background: transparent;
            padding: 0;
            border: none;
            backdrop-filter: none;
            box-shadow: none;
            border-radius: 0;
        }
        .user .message-actions { right: calc(100% + 8px); left: auto; }
        .friend .message-actions { left: calc(100% + 8px); right: auto; }
        .message-row:hover .message-actions,
        .message-row .message-actions.active { opacity: 1; visibility: visible; }
        
        .action-dots-btn {
            background: var(--accent);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.15s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .action-dots-btn:active {
            transform: scale(0.9);
            background: var(--accent-dark);
        }
        .action-dots-btn svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
        }

        /* ===== ОКНО ДЕЙСТВИЙ ===== */
        .action-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .action-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .action-modal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 0;
            width: 220px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            border: 0.5px solid var(--popup-border);
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
        }
        .action-modal-overlay.show .action-modal-card {
            transform: scale(1);
        }
        
        .action-modal-item {
            padding: 16px 24px;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: center;
            transition: background 0.1s;
            font-weight: 500;
            width: 100%;
            display: block;
            border-bottom: 0.5px solid var(--popup-border);
        }
        .action-modal-item:last-child {
            border-bottom: none;
        }
        .action-modal-item:active {
            background: var(--popup-item-hover);
        }
        .action-modal-item.danger {
            color: #ff6b6b;
        }

        /* ===== ПОПАП ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ ===== */
        .confirm-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .confirm-popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .confirm-popup-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 0;
            width: 240px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
            border: 0.5px solid var(--popup-border);
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
        }
        .confirm-popup-overlay.show .confirm-popup-card {
            transform: scale(1);
        }
        
        .confirm-popup-title {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            padding: 20px 20px 16px;
            border-bottom: 0.5px solid var(--popup-border);
        }
        
        .confirm-popup-actions {
            display: flex;
        }
        
        .confirm-popup-btn {
            flex: 1;
            padding: 16px 0;
            font-size: 15px;
            font-weight: 500;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: background 0.1s;
            color: var(--text);
        }
        .confirm-popup-btn:active {
            background: var(--popup-item-hover);
        }
        .confirm-popup-btn:first-child {
            border-right: 0.5px solid var(--popup-border);
            color: #ff6b6b;
        }

        /* ===== АНИМАЦИЯ ОТПРАВКИ ===== */
        @keyframes messageSend {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-4px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-row.sending {
            animation: messageSend 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }

        /* ===== АУДИОПЛЕЕР (упрощённый) ===== */
        .audio-player {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 18px;
            border-radius: 28px;
            width: 320px;
            max-width: 100%;
            border: 0.5px solid rgba(255,255,255,0.4);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .friend .audio-player { background: rgba(255,255,255,0.5); backdrop-filter: blur(8px); }
        .user .audio-player { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border-color: rgba(255,255,255,0.15); }

        .audio-player .track-name {
            font-size: 13px;
            color: #7c3aed;
            font-weight: 500;
            padding-left: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .audio-player .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .audio-player .play-btn {
            background: var(--wave-gradient);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s;
            box-shadow: 0 4px 16px rgba(124,58,237,0.3);
        }
        .audio-player .play-btn:active { transform: scale(0.9); }
        .audio-player .play-btn svg {
            width: 18px; height: 18px; stroke: white; stroke-width: 2.5; fill: none;
        }
        .audio-player .progress-wrap {
            flex: 1; height: 24px; position: relative; cursor: pointer; display: flex; align-items: center;
        }
        .audio-player .progress-wrap .wave-line {
            width: 100%; height: 3px; background: rgba(0,0,0,0.08); border-radius: 4px; overflow: hidden; position: relative;
        }
        .audio-player .progress-wrap .wave-line .wave-fill {
            height: 100%;
            background: var(--wave-gradient);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        .audio-player .progress-wrap .wave-line .wave-fill::after {
            content: '';
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 100%;
            background: var(--wave-gradient);
            border-radius: 4px;
            transform: translateY(-50%);
            animation: wavePulse 1.2s ease-in-out infinite;
            animation-play-state: paused;
        }
        .audio-player .progress-wrap .wave-line .wave-fill.playing::after {
            animation-play-state: running;
        }
        @keyframes wavePulse {
            0%, 100% { height: 100%; }
            50% { height: 400%; }
        }
        .audio-player .progress-wrap input[type="range"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; margin: 0; padding: 0;
        }
        .audio-player .time {
            font-size: 13px; color: #7c3aed; font-weight: 600;
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .audio-player .time.current { min-width: 28px; text-align: left; }
        .audio-player .time:last-child { min-width: 28px; text-align: right; }

        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;pointer-events:none}
        .loading-bar-wrap{width:100px}
        .loading-bar{width:100%;height:6px;background:var(--border);border-radius:6px;overflow:hidden}
        .loading-bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width 0.4s ease}
        .loading-text{font-size:14px;font-weight:500;color:var(--text-light)}
        .room-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase;letter-spacing:0.5px;box-shadow:0 3px 8px rgba(0,0,0,0.18)}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:100}
        .modal-card{background:var(--popup-bg);backdrop-filter:blur(20px);border-radius:36px;padding:32px 28px;width:86%;max-width:340px;text-align:center;border:0.5px solid var(--popup-border);position:relative;overflow:hidden}
        .modal-card h3{font-size:26px;font-weight:600;margin-bottom:24px;color:var(--text)}
        .modal-input{width:100%;padding:14px 18px;background:var(--input-bg);border:1px solid var(--popup-border);border-radius:44px;font-size:16px;margin-bottom:14px;color:var(--text);outline:none}.modal-input:focus{border-color:var(--accent)}
        .modal-btn{background:var(--accent);border:none;padding:14px;border-radius:44px;width:100%;color:white;font-size:17px;font-weight:600;cursor:pointer;margin-top:6px}.modal-btn:active{transform:scale(0.97);background:var(--accent-dark)}
        .modal-warning{background:rgba(139,195,74,0.1);border-left:3px solid var(--accent);padding:10px 12px;border-radius:14px;margin-top:16px;text-align:left}.modal-warning-text{font-size:12px;color:var(--accent-dark);font-weight:500}
        .room-popup,.settings-popup{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);width:290px;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-radius:28px;box-shadow:0 12px 32px rgba(0,0,0,0.25),0 0 0 0.5px rgba(255,255,255,0.2) inset;z-index:150;opacity:0;visibility:hidden;transition:all 0.25s cubic-bezier(0.2, 0, 0, 1);overflow:hidden}
        .room-popup,.settings-popup{background:var(--popup-gradient)}
        .room-popup.show,.settings-popup.show{opacity:1;visibility:visible}
        .room-popup.show,.settings-popup.show{transform:translateX(-50%) translateY(0)}
        .room-popup-header,.settings-popup-header{padding:16px 14px 10px;font-size:16px;font-weight:600;color:var(--text);border-bottom:0.5px solid var(--popup-border);text-align:center;letter-spacing:0.3px}

function compressImage(file, maxW = 800) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

            const img = new Image();

function renderMsg(msg, id, insertAtEnd = false) {

}

// ===== ЛОГИКА ЦЕНТРАЛЬНОГО МЕНЮ =====
actionModal.addEventListener('click', (e) => {
    const target = e.target.closest('.action-modal-item');
    if (!target) {
        actionModal.classList.remove('show');
        pendingActionId = null;
        return;
    }
    const action = target.dataset.action;
    const id = pendingActionId;
    const msg = messagesCache[id];
    actionModal.classList.remove('show');
    pendingActionId = null;
    if (!msg) return;
    if (action === 'copy') {
        const textToCopy = msg.text || '';
        if (textToCopy) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).catch(() => {
                    const textArea = document.createElement('textarea');
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                });
            } else {
                const textArea = document.createElement('textarea');
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
        }
    } else if (action === 'edit') {
        if (msg.type !== 'image' || msg.text) {
             startEdit(id);
        } else {
             alert('Нельзя редактировать сообщение только с картинкой');
        }
    } else if (action === 'delete') {
        showDel(id);
    }
});

function updateMsgElement(id, newMsg) {
    const el = messagesArea.querySelector(`.message-row[data-id="${id}"]`);
    if (!el) return;
    const bubbleDiv = el.querySelector('.bubble');
    const textBelow = el.querySelector('.bubble-text-below');
    const timeSpan = el.querySelector('.msg-time');
    if (bubbleDiv && newMsg.text && newMsg.type !== 'image') bubbleDiv.textContent = newMsg.text;
    if (textBelow && newMsg.text && newMsg.type === 'image') textBelow.textContent = newMsg.text;
    if (timeSpan) timeSpan.textContent = ftime(newMsg.time) + (newMsg.edited ? ' (ред.)' : '');
}

function loadMsgs() {
    if (!currentRoom) return;
    if (messagesListener) { messagesListener(); messagesListener = null; }
    messagesArea.innerHTML = '<div class="empty-chat">🍃 загрузка...</div>';
    const msgsRef = ref(database, `rooms/${currentRoom}/messages`);
    const initialQuery = query(msgsRef, limitToLast(30));
    get(initialQuery).then(snapshot => {
        const data = snapshot.val();
        messagesArea.innerHTML = '';
        if (!data) { messagesArea.innerHTML = '<div class="empty-chat">🍃 здесь пока тишина</div>'; return; }
        const arr = Object.entries(data).sort((a, b) => (a[1].time||'').localeCompare(b[1].time||''));
        arr.forEach(([id, msg]) => { messagesCache[id] = msg; renderMsg(msg, id, true); });
        if (!arr.length) messagesArea.innerHTML = '<div class="empty-chat">🍃 здесь пока тишина</div>';
        scrollToBottom();
    });
    messagesListener = onChildAdded(msgsRef, (snapshot) => {
        try {
            const id = snapshot.key;
            const msg = snapshot.val();
            if (!msg || messagesCache[id]) return;
            messagesCache[id] = msg;
            renderMsg(msg, id, true);
            const wasAtBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 100;
            if (wasAtBottom || msg.userName === currentName) {
                requestAnimationFrame(() => { messagesArea.scrollTop = messagesArea.scrollHeight; });
            }
        } catch(e) {
            console.warn('Ошибка при добавлении сообщения:', e);
        }
    });
    onChildChanged(msgsRef, (snapshot) => {
        const id = snapshot.key;
        const newMsg = snapshot.val();
        if (messagesCache[id]) { messagesCache[id] = newMsg; updateMsgElement(id, newMsg); }
    });
    onChildRemoved(msgsRef, (snapshot) => {
        const id = snapshot.key;
        if (messagesCache[id]) delete messagesCache[id];
        const el = messagesArea.querySelector(`.message-row[data-id="${id}"]`);
        if (el) el.remove();
        if (messagesArea.children.length === 0) messagesArea.innerHTML = '<div class="empty-chat">🍃 здесь пока тишина</div>';
    });
}

function startEdit(id) { const row = document.querySelector(`.message-row[data-id="${id}"]`); if (!row) return; const bubble = row.querySelector('.bubble'), textBelow = row.querySelector('.bubble-text-below'); const el = bubble || textBelow; if (!el) return; editingId = id; messageInput.value = el.textContent || ''; messageInput.focus(); messageInput.setSelectionRange(messageInput.value.length, messageInput.value.length); sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'; sendBtn.style.background = 'var(--accent-dark)'; autoResizeTextarea(); }
function cancelEdit() { editingId = null; messageInput.value = ''; sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="18" y2="12"/><polyline points="13 7 19 12 13 17"/></svg>'; sendBtn.style.background = ''; autoResizeTextarea(); }
async function saveEdit() { if (!editingId) return; const t = messageInput.value.trim(); if (!t) { cancelEdit(); return; } if (t.length > 15000) { alert('сообщение не длиннее 15000 символов'); return; } const o = messagesCache[editingId]; if (!o) { cancelEdit(); return; } try { await set(ref(database, `rooms/${currentRoom}/messages/${editingId}`), { ...o, text: t, edited: true }); cancelEdit(); } catch(e) { console.error(e); alert('не удалось отредактировать'); cancelEdit(); } }

// ===== ПОПАП ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ =====
function showDel(id) { 
    if (!id) return;
    pendingDelId = id; 
    confirmPopup.classList.add('show'); 
}
function hideDel() { 
    confirmPopup.classList.remove('show'); 
    pendingDelId = null; 
}
async function delMsg() { 
    if (!pendingDelId || !currentRoom) { hideDel(); return; } 
    try { 
        const s = await get(ref(database, `rooms/${currentRoom}/messages/${pendingDelId}`)); 
        const m = s.val(); 
        if (!m) { hideDel(); return; } 
        if (m.userName !== currentName) { 
            alert('Вы можете удалять только свои сообщения'); 
            hideDel(); 
            return; 
        } 
    } catch(e) { 
        hideDel(); 
        return; 
    } 
    try { 
        await remove(ref(database, `rooms/${currentRoom}/messages/${pendingDelId}`)); 
    } catch(e) { 
        console.error(e); 
        alert('не удалось удалить'); 
    } 
    hideDel(); 
}

['click', 'touchend'].forEach(event => {
    confirmYes.addEventListener(event, (e) => {
        if (e.type === 'touchend') e.preventDefault();
        delMsg();
    });
    confirmNo.addEventListener(event, (e) => {
        if (e.type === 'touchend') e.preventDefault();
        hideDel();
    });
});

function switchRoom(r) { 
    hideDel();
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    document.querySelectorAll('audio').forEach(a => a.pause());
    const cr = r.trim(); 
    if (!cr) { alert('название комнаты не может быть пустым'); hideRoomPopup(); return; } 
    if (cr === currentRoom) { hideRoomPopup(); return; } 
    if (messagesListener) { 
        messagesListener(); 
        messagesListener = null; 
    }
    // Удаляем обработчик actionModal при смене комнаты
    // (он удалится сам при перезагрузке страницы, но для чистоты)
    cancelEdit(); cancelReply(); cancelImage(); 
    currentRoom = cr; 
    messagesCache = {}; 
    addRoomHist(currentRoom); 
    roomNameSpan.textContent = `#${currentRoom}`; 
    roomStatusSpan.textContent = currentName ? `вы как ${currentName}` : 'войдите, чтобы писать'; 
    loadMsgs(); 
    messageInput.focus(); 
    hideRoomPopup(); 
}

async function exitChat() { 
    hideDel();
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    document.querySelectorAll('audio').forEach(a => a.pause());
    if (messagesListener) { 
        messagesListener(); 
        messagesListener = null; 
    }
    cancelEdit(); cancelReply(); cancelImage(); 
    currentRoom = null; currentName = null; 
    messagesCache = {}; 
    messagesArea.innerHTML = '<div class="empty-chat">✨ введите ник и комнату</div>'; 
    roomNameSpan.textContent = 'воздушный чат'; 
    roomStatusSpan.textContent = 'ожидание входа'; 
    modal.style.display = 'flex'; 
    roomInput.value = ''; nameInput.value = ''; 
    messageInput.value = ''; 
    autoResizeTextarea(); 
}

function enterChat() { const n = nameInput.value.trim(), r = roomInput.value.trim(); if (!n || !r) { alert('введите ник и код комнаты'); return; } currentName = n; currentRoom = r; addRoomHist(r); localStorage.setItem('last_name', n); localStorage.setItem('last_room', r); roomNameSpan.textContent = `#${currentRoom}`; roomStatusSpan.textContent = `вы как ${currentName}`; modal.style.display = 'none'; loadMsgs(); messageInput.focus(); autoResizeTextarea(); }
function saveRooms() { localStorage.setItem('room_history', JSON.stringify(savedRooms)); }
function addRoomHist(r) { if (!savedRooms.includes(r)) { savedRooms.unshift(r); if (savedRooms.length > 5) savedRooms.pop(); saveRooms(); } }
function updPopup() { popupRoomList.innerHTML = ''; if (!savedRooms.length) { const d = document.createElement('div'); d.style.cssText = 'padding:16px;text-align:center;color:var(--text-light);font-size:14px'; d.textContent = 'нет сохранённых комнат'; popupRoomList.appendChild(d); } else { savedRooms.forEach(r => { const i = document.createElement('div'); i.className = 'room-popup-item'; i.style.fontSize = fontSize + 'px'; i.onclick = () => { hideRoomPopup(); switchRoom(r); }; i.innerHTML = `<div class="room-avatar" style="background:${getAvatarGradient(r)}">${esc(r.charAt(0).toUpperCase())}</div><div class="room-popup-item-info"><div class="room-popup-item-name">${esc(r)}</div><div class="room-popup-item-meta">${r === currentRoom ? '✓ вы здесь' : 'нажмите чтобы войти'}</div></div>`; popupRoomList.appendChild(i); }); } }
function showRoomPopup() { updPopup(); popupRoomInput.value = ''; roomPopup.classList.add('show'); }
function hideRoomPopup() { roomPopup.classList.remove('show'); }

async function sendMessage(text, imageData) {
    if (!currentRoom || !currentName) return false;
    const nm = { 
        userName: currentName, 
        time: new Date().toISOString(),
        type: imageData ? 'image' : 'text',
        text: text || '',
        ...(imageData && { data: imageData })
    };
    if (replyTo) nm.replyTo = replyTo;
    try { await push(ref(database, `rooms/${currentRoom}/messages`), nm); cancelReply(); cancelImage(); return true; }
    catch(e) { alert('ошибка отправки'); return false; }
}

async function sendOrSave() { 
    if (isSending) return; 
    if (!currentRoom || !currentName) { modal.style.display = 'flex'; return; } 
    if (editingId) { await saveEdit(); return; } 
    const t = messageInput.value.trim(); 
    if (!t && !pendingImage) return; 
    if (t.length > 15000) { alert('сообщение не длиннее 15000 символов'); return; } 
    isSending = true; 
    let ok = false;
    if (pendingImage) {
        ok = await sendMessage(t, pendingImage.data);
    } else {
        ok = await sendMessage(t, null);
    }
    isSending = false; 
    if (ok) { 
        messageInput.value = ''; 
        autoResizeTextarea(); 
        shouldScroll = true; 
        scrollToBottom(); 
    } 
}

function applyFont() { document.body.style.fontSize = fontSize + 'px'; messageInput.style.fontSize = fontSize + 'px'; document.querySelectorAll('.bubble').forEach(el => el.style.fontSize = fontSize + 'px'); document.querySelectorAll('.bubble-text-below').forEach(el => el.style.fontSize = fontSize + 'px'); fontSizeSpan.textContent = fontSize; localStorage.setItem('font_size', fontSize); autoResizeTextarea(); }
function loadSettings() { const sf = localStorage.getItem('font_size'); if (sf) { fontSize = parseInt(sf); fontSize = Math.min(24, Math.max(12, fontSize)); } else { fontSize = 16; } applyFont(); }

roomInfo.onclick = showRoomPopup; settingsBtn.onclick = () => settingsPopup.classList.add('show');
closePopupBtn.onclick = hideRoomPopup; closeSettingsPopupBtn.onclick = () => settingsPopup.classList.remove('show');
popupRoomInput.onkeypress = e => { if (e.key === 'Enter') { const v = popupRoomInput.value.trim(); if (v) { hideRoomPopup(); switchRoom(v); } } };
fontMinus.onclick = () => { fontSize = Math.max(12, fontSize - 1); applyFont(); }; fontPlus.onclick = () => { fontSize = Math.min(24, fontSize + 1); applyFont(); };
exitBtn.onclick = async () => { await exitChat(); settingsPopup.classList.remove('show'); };
document.addEventListener('click', e => { if (roomPopup.classList.contains('show') && !roomPopup.contains(e.target) && e.target !== roomInfo && !roomInfo.contains(e.target)) hideRoomPopup(); if (settingsPopup.classList.contains('show') && !settingsPopup.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)) settingsPopup.classList.remove('show'); });
joinBtn.onclick = enterChat; sendBtn.onclick = () => sendOrSave(); attachBtn.onclick = () => fileInput.click();

messageInput.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (messageInput.value.trim() || editingId || pendingImage) sendOrSave(); } });

imageViewerClose.onclick = closeViewer; imageViewer.onclick = e => { if (e.target === imageViewer) closeViewer(); };
function closeViewer() { imageViewer.classList.remove('show'); document.body.style.overflow = ''; }
function openViewer(url) { imageViewerImg.src = url; imageViewer.classList.add('show'); document.body.style.overflow = 'hidden'; }
document.onkeydown = e => { if (e.key === 'Escape') { if (imageViewer.classList.contains('show')) closeViewer(); else if (editingId) cancelEdit(); else if (replyTo) cancelReply(); else if (pendingImage) cancelImage(); else if (actionModal.classList.contains('show')) { actionModal.classList.remove('show'); pendingActionId = null; } } };
document.addEventListener('DOMContentLoaded', () => { const ln = localStorage.getItem('last_name'), lr = localStorage.getItem('last_room'); if (ln && lr) { nameInput.value = ln; roomInput.value = lr; enterChat(); } });
loadSettings();

messageInput.addEventListener('input', autoResizeTextarea);
autoResizeTextarea();
</script>
</body>
</html>
