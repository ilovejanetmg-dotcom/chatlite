<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Чат</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <style>
        /* (стили оставил те же, что были в последней версии) */
        * { outline: none !important; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: #f2f5f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 400px; height: 100dvh; max-height: 800px; background: #f2f5f8; display: flex; flex-direction: column; border: 1px solid #ddd; position: relative; overflow: hidden; }
        .menu-wrapper { position: absolute; top: 0; left: 0; width: 280px; height: 100%; background: #fff; border-right: 1px solid #e5e5e5; transform: translateX(-100%); transition: transform .3s ease; z-index: 10; display: flex; flex-direction: column; padding: 20px 15px; box-shadow: 2px 0 15px rgba(0,0,0,.1); }
        .menu-wrapper.active { transform: translateX(0); }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .menu-title { font-size: 20px; font-weight: 600; color: #333; }
        .login-btn { background: #e6e6e6; border: none; border-radius: 20px; padding: 6px 16px; font-size: 14px; font-weight: 500; color: #333; cursor: pointer; transition: background 0.15s; }
        .login-btn:active { background: #d5d5d5; }
        .menu-label { font-size: 13px; color: #888; margin-bottom: 4px; margin-top: 10px; }
        .menu-input { border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; outline: none; background: #f8f9fa; height: 40px; }
        .menu-input:focus { border-color: #3a7ec8; }
        .menu-spacer { flex-grow: 1; }
        .theme-switch { margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; }
        .theme-switch label { font-size: 14px; color: #555; }
        .theme-switch input[type="checkbox"] { width: 40px; height: 22px; appearance: none; background: #ccc; border-radius: 12px; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .theme-switch input[type="checkbox"]:checked { background: #6c5ce7; }
        .theme-switch input[type="checkbox"]::before { content: ''; position: absolute; width: 18px; height: 18px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
        .theme-switch input[type="checkbox"]:checked::before { transform: translateX(18px); }
        .font-size-control { margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }
        .font-size-control .menu-label { margin-top: 0; }
        .size-controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .size-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ddd; background: #f8f9fa; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #333; }
        .size-btn:active { background: #e0e0e0; }
        .size-display { font-size: 14px; color: #555; min-width: 30px; text-align: center; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; transition: margin-left .3s ease; width: 100%; height: 100dvh; }
        .main-content.active { margin-left: 280px; }
        .header { background: #fff; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #e5e5e5; height: 55px; flex-shrink: 0; }
        .back-btn { font-size: 20px; color: #3a7ec8; margin-right: 15px; cursor: pointer; background: none; border: none; padding: 0; }
        .back-btn:active { transform: scale(.9); }
        .header-title { font-size: 16px; font-weight: 500; color: #333; display: none; }
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .message-row { display: flex; align-items: flex-start; max-width: 85%; transition: transform .2s ease; touch-action: pan-y; cursor: default; will-change: transform; position: relative; }
        .message-row.incoming { align-self: flex-start; }
        .message-row.outgoing { align-self: flex-end; }
        .bubble { padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; white-space: pre-wrap; }
        .bubble .quote-block { font-size: 0.9em; border-left: 3px solid rgba(255,255,255,0.5); padding-left: 8px; margin-bottom: 6px; color: rgba(255,255,255,0.7); display: block; line-height: 1.3; }
        .timestamp-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 4px; }
        .message-row.incoming .timestamp-row { justify-content: flex-start; }
        .timestamp { font-size: 11px; color: #a0aab5; }
        .check-mark { display: inline-block; margin-left: 2px; font-size: 12px; }
        .msg-menu-dots { font-size: 14px; letter-spacing: 1px; cursor: pointer; color: #a0aab5; user-select: none; line-height: 1; padding: 0 2px; }
        .msg-menu-dots:active { color: #666; }
        .message-actions { display: none; position: absolute; top: -45px; right: 0; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); padding: 6px 10px; gap: 8px; z-index: 20; flex-direction: row; white-space: nowrap; }
        .message-actions.visible { display: flex; }
        .message-actions button { background: none; border: none; padding: 4px 8px; font-size: 13px; cursor: pointer; border-radius: 4px; color: #333; font-family: inherit; }
        .message-actions button:active { background: #f0f0f0; }
        .message-actions .delete-btn { color: #d32f2f; }
        .input-area { background: #ffffff; border: none; box-shadow: none; border-radius: 24px; padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 6px; }
        .input-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .quote-preview { display: none; background: #f2f5f8; padding: 6px 10px; border-radius: 8px; border-left: 3px solid #6c5ce7; font-size: 13px; color: #555; position: relative; margin-bottom: 4px; max-height: 60px; overflow: hidden; }
        .quote-preview .close-quote { position: absolute; right: 6px; top: 6px; cursor: pointer; color: #999; font-size: 14px; line-height: 1; }
        .input-field { flex-grow: 1; background: transparent; border: none; outline: none; font-size: 16px; padding: 10px 0; color: #1a1a1a; resize: none; font-family: inherit; min-height: 40px; max-height: 120px; line-height: 1.4; width: 100%; scrollbar-width: none; -ms-overflow-style: none; }
        .input-field::-webkit-scrollbar { display: none; }
        .input-field::placeholder { color: #999; }
        .btn-circle { width: 36px; height: 36px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
        .btn-circle-gray { background: #e6e6e6; color: #333; }
        .btn-circle-gray:active { background: #d5d5d5; }
        .btn-circle-purple { background: #6c5ce7; color: #fff; }
        .btn-circle-purple:active { background: #5a4bd1; }
        .btn-circle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .file-preview { display: none; padding: 4px 0 2px 0; position: relative; width: 100%; }
        .file-preview.visible { display: block; }
        .file-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; border: 1px solid #e5e5e5; }
        .file-preview .remove-btn { position: absolute; top: 0; left: 48px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .photo-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; }
        .photo-overlay.active { display: flex; }
        .photo-overlay img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; cursor: pointer; }
        .photo-overlay .close-btn { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; z-index: 5; background: transparent; display: none; }
        .overlay.active { display: block; }
        
        /* Темы */
        body.theme-classic .chat-area { background: #f2f5f8; }
        body.theme-classic .message-row.incoming .bubble { background: #fff; color: #000; border: 1px solid #e5e5e5; border-top-left-radius: 0; }
        body.theme-classic .message-row.outgoing .bubble { background: #3a7ec8; color: #fff; border-top-right-radius: 0; }
        body.theme-classic .bubble .quote-block { border-left-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.7); }
        body.theme-classic .message-row.incoming .bubble .quote-block { border-left-color: #aaa; color: #777; }
        
        body.theme-gray .chat-area { background: #ffffff; }
        body.theme-gray .message-row.incoming .bubble,
        body.theme-gray .message-row.outgoing .bubble { background: #f2f2f2; color: #1a1a1a; border: none; border-radius: 12px; }
        body.theme-gray .message-row.incoming .bubble { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        body.theme-gray .message-row.outgoing .bubble { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        body.theme-gray .bubble .quote-block { border-left-color: rgba(0,0,0,0.2); color: rgba(0,0,0,0.5); }
        body.theme-gray .msg-menu-dots { color: #bbb; }
        body.theme-gray .timestamp { color: #bbb; }
    </style>
</head>
<body class="theme-classic">

<div class="app-container">
    <div class="menu-wrapper" id="menuWrapper">
        <div class="menu-header">
            <div class="menu-title">Профиль</div>
            <button class="login-btn" id="loginBtn">Вход</button>
        </div>
        
        <div class="menu-label">Ник</div>
        <input class="menu-input" id="nickInput" placeholder="Введите ник..." value="Гость">
        
        <div class="menu-label">Пространство</div>
        <input class="menu-input" id="spaceInput" placeholder="Введите пространство..." value="main">
        
        <div class="theme-switch">
            <label>Светлая тема</label>
            <input type="checkbox" id="themeToggle">
        </div>
        
        <div class="font-size-control">
            <div class="menu-label">Размер шрифта</div>
            <div class="size-controls">
                <button class="size-btn" id="fontMinus">–</button>
                <span class="size-display" id="fontSizeDisplay">100%</span>
                <button class="size-btn" id="fontPlus">+</button>
            </div>
        </div>
        
        <div class="menu-spacer"></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="main-content" id="mainContent">
        <div class="header">
            <button class="back-btn" id="menuToggle">&#8592;</button>
            <div class="header-title">Чат</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message-row incoming" data-id="system-1">
                <div class="message-content">
                    <div class="bubble">Добро пожаловать. Выберите ник и пространство в боковой панели.<br>Приятного общения</div>
                    <div class="timestamp-row">
                        <span class="timestamp">09:41</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <div class="quote-preview" id="quotePreview"><span id="quoteText"></span><span class="close-quote" onclick="clearQuote()">✕</span></div>
                <div class="file-preview" id="filePreview">
                    <img id="previewImage" src="" alt="preview">
                    <button class="remove-btn" onclick="removeFile()">✕</button>
                </div>
                <textarea class="input-field" id="inputField" placeholder="Сообщение..." rows="1"></textarea>
            </div>
            <button class="btn-circle btn-circle-gray" id="clipBtn" onclick="document.getElementById('fileInput').click()">
                <svg viewBox="0 0 24 24"><path d="M16.5 6.75c-1.5-1.5-4.5-1.5-6 0l-7.5 7.5c-1.5 1.5-1.5 4.5 0 6s4.5 1.5 6 0l6.75-6.75"/></svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <button class="btn-circle btn-circle-purple" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="photo-overlay" id="photoOverlay" onclick="closePhotoViewer()">
    <img id="fullscreenImage" src="" alt="fullscreen">
    <span class="close-btn" onclick="closePhotoViewer()">✕</span>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTWmu7mReenRJXFEw-Wxu70ZqfEVHu1ao",
        authDomain: "chatlife-26930.firebaseapp.com",
        databaseURL: "https://chatlife-26930-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "chatlife-26930",
        storageBucket: "chatlife-26930.firebasestorage.app",
        messagingSenderId: "329135378723",
        appId: "1:329135378723:web:87a60044b3db7bf992bc96"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    const chatArea = document.getElementById('chatArea');
    const inputField = document.getElementById('inputField');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const quotePreview = document.getElementById('quotePreview');
    const quoteText = document.getElementById('quoteText');
    const menuWrapper = document.getElementById('menuWrapper');
    const overlay = document.getElementById('overlay');
    const menuToggle = document.getElementById('menuToggle');
    const mainContent = document.getElementById('mainContent');
    const filePreview = document.getElementById('filePreview');
    const previewImage = document.getElementById('previewImage');
    const photoOverlay = document.getElementById('photoOverlay');
    const fullscreenImage = document.getElementById('fullscreenImage');
    const nickInput = document.getElementById('nickInput');
    const spaceInput = document.getElementById('spaceInput');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const themeToggle = document.getElementById('themeToggle');

    let replyToId = null, menuOpen = false, editingId = null;
    let selectedFile = null;
    let isZoomed = false;
    let currentUser = null;
    let currentSpace = null;
    let messagesRef = null;
    let messagesListener = null;
    let fontSizePercent = 100;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function truncateText(text, maxLines = 3) {
        const lines = text.split('\n');
        if (lines.length > maxLines) return lines.slice(0, maxLines).join('\n') + '...';
        return text;
    }

    function clearQuote() {
        quotePreview.style.display = 'none';
        quoteText.textContent = '';
        replyToId = null;
    }

    function clearEdit() {
        editingId = null;
        inputField.value = '';
        inputField.placeholder = 'Сообщение...';
        inputField.style.height = 'auto';
    }

    const closeAllActionMenus = () => document.querySelectorAll('.message-actions.visible').forEach(el => el.classList.remove('visible'));

    function removeFile() {
        selectedFile = null;
        filePreview.classList.remove('visible');
        previewImage.src = '';
        fileInput.value = '';
        inputField.focus();
    }

    function openPhotoViewer(src) {
        fullscreenImage.src = src;
        photoOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        isZoomed = false;
        fullscreenImage.style.transform = 'scale(1)';
    }

    function closePhotoViewer() {
        photoOverlay.classList.remove('active');
        document.body.style.overflow = 'auto';
        fullscreenImage.src = '';
        isZoomed = false;
    }

    fullscreenImage.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!isZoomed) {
            isZoomed = true;
            this.style.transform = 'scale(2)';
        } else {
            isZoomed = false;
            this.style.transform = 'scale(1)';
        }
    });

    function toggleMenu() {
        menuOpen = !menuOpen;
        menuWrapper.classList.toggle('active', menuOpen);
        mainContent.classList.toggle('active', menuOpen);
        overlay.classList.toggle('active', menuOpen);
        document.body.style.overflow = menuOpen ? 'hidden' : 'auto';
    }
    menuToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);

    const menuInputs = menuWrapper.querySelectorAll('input');
    menuInputs.forEach(input => {
        input.addEventListener('focus', function(e) {
            e.preventDefault();
            menuWrapper.style.position = 'absolute';
            menuWrapper.style.top = '0';
            setTimeout(() => {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            }, 50);
        });
        input.addEventListener('blur', function() {
            menuWrapper.style.position = 'absolute';
            menuWrapper.style.top = '0';
        });
    });

    inputField.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    });

    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files.length > 0) {
            selectedFile = this.files[0];
            previewImage.src = URL.createObjectURL(selectedFile);
            filePreview.classList.add('visible');
            inputField.focus();
        }
    });

    function toggleMsgMenu(dots) {
        const row = dots.closest('.message-row');
        if (row.classList.contains('incoming')) return;
        const actions = row.querySelector('.message-actions');
        if (actions) {
            const isVisible = actions.classList.contains('visible');
            closeAllActionMenus();
            if (!isVisible) {
                actions.classList.add('visible');
            }
        }
    }

    async function handleMessageAction(btn, action) {
        const msg = btn.closest('.message-row');
        if (!msg || msg.classList.contains('incoming')) return;
        const msgId = msg.dataset.id;
        
        if (action === 'delete') {
            if (confirm('Удалить сообщение?')) {
                await messagesRef.child(msgId).remove();
                msg.remove();
            }
        } else if (action === 'edit') {
            const bubble = msg.querySelector('.bubble');
            let text = msg.dataset.cleanText;
            if (!text) {
                const textNode = bubble.querySelector('div:last-child');
                text = textNode ? textNode.textContent : bubble.textContent;
            }
            inputField.value = text;
            inputField.focus();
            editingId = msgId;
            inputField.placeholder = 'Редактирование...';
            inputField.style.height = 'auto';
            inputField.style.height = inputField.scrollHeight + 'px';
        }
        closeAllActionMenus();
    }

    function attachMessageHandlers(element) {
        let startX = 0, startY = 0, currentDelta = 0, isHorizontal = false;
        const MAX_SWIPE = 80;

        element.addEventListener('touchstart', function(e) {
            if (e.target.tagName === 'IMG') return;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentDelta = 0;
            isHorizontal = false;
            this.style.transition = 'none';
        }, { passive: true });

        element.addEventListener('touchmove', function(e) {
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            currentDelta = deltaX;

            if (!isHorizontal && Math.abs(deltaY) > Math.abs(deltaX) * 0.5) return;

            if (deltaX < 0 && Math.abs(deltaX) > Math.abs(deltaY) * 0.5) {
                isHorizontal = true;
                const limitedDelta = Math.max(deltaX, -MAX_SWIPE);
                this.style.transform = `translateX(${limitedDelta}px)`;
            }
        }, { passive: true });

        element.addEventListener('touchend', function(e) {
            this.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            if (isHorizontal && currentDelta < -60) {
                let text = this.dataset.cleanText || this.querySelector('.bubble').textContent;
                quoteText.textContent = truncateText(text, 3);
                quotePreview.style.display = 'block';
                replyToId = this.dataset.id;
                inputField.focus();
                closeAllActionMenus();
            }
            this.style.transform = 'translateX(0px)';
        }, { passive: true });
    }

    function addMessageToChat(msg, msgId) {
        const isOutgoing = msg.userName === currentUser;
        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
        messageRow.dataset.id = msgId;
        messageRow.dataset.cleanText = msg.text || '';
        
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        
        let bubbleHtml = '';
        if (msg.imageUrl) {
            bubbleHtml = `<img src="${msg.imageUrl}" style="max-width:100%; max-height:200px; border-radius:8px; cursor:pointer;" onclick="openPhotoViewer(this.src)">`;
            if (msg.text) {
                bubbleHtml = `<div>${bubbleHtml}</div><div>${escapeHtml(msg.text)}</div>`;
            }
        } else {
            bubbleHtml = escapeHtml(msg.text || '');
        }
        
        if (msg.replyTo && msg.replyText) {
            const truncated = msg.replyText.length > 60 ? msg.replyText.substring(0, 60) + '...' : msg.replyText;
            bubbleHtml = `<div class="quote-block">${escapeHtml(truncated)}</div>${bubbleHtml}`;
        }
        
        const menuButton = isOutgoing ? `<span class="msg-menu-dots" onclick="toggleMsgMenu(this)">•••</span>` : '';
        
        messageRow.innerHTML = `
            <div class="message-content">
                <div class="bubble">${bubbleHtml}</div>
                <div class="timestamp-row">
                    ${!isOutgoing ? `<span class="timestamp">${time} ${escapeHtml(msg.userName)}</span>` : ''}
                    ${menuButton}
                    ${isOutgoing ? `<span class="timestamp">${time} Вы <span class="check-mark">✓</span></span>` : ''}
                </div>
            </div>
            <div class="message-actions">
                <button onclick="handleMessageAction(this, 'edit')">Редактировать</button>
                <button onclick="handleMessageAction(this, 'delete')">Удалить</button>
            </div>
        `;
        
        chatArea.appendChild(messageRow);
        attachMessageHandlers(messageRow);
        
        const img = messageRow.querySelector('img');
        if (img && !img.hasClickListener) {
            img.hasClickListener = true;
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                openPhotoViewer(img.src);
            });
        }
    }

    // ===== ИСПРАВЛЕННАЯ ФУНКЦИЯ ВХОДА =====
    function joinSpace() {
        const nick = nickInput.value.trim();
        const space = spaceInput.value.trim();
        
        if (!nick || !space) {
            alert('Введите ник и пространство');
            return false;
        }
        
        // Если уже подключены к этому пространству — ничего не делаем
        if (currentUser === nick && currentSpace === space && messagesRef) {
            console.log('Уже в этом пространстве');
            return true;
        }
        
        console.log('Вход в пространство:', space, 'как', nick);
        
        // 1. Отключаемся от старой комнаты, если была
        if (messagesListener) {
            messagesRef.off('child_added', messagesListener);
            messagesListener = null;
            console.log('Отключились от старой комнаты');
        }
        
        // 2. Обновляем данные
        currentUser = nick;
        currentSpace = space;
        
        localStorage.setItem('chat_nick', nick);
        localStorage.setItem('chat_space', space);
        
        // 3. Очищаем чат и оставляем только системное сообщение
        const systemMsg = document.querySelector('[data-id="system-1"]');
        chatArea.innerHTML = '';
        if (systemMsg) chatArea.appendChild(systemMsg);
        
        // 4. Создаём ссылку на новую комнату
        messagesRef = db.ref(`rooms/${space}/messages`);
        
        // 5. Проверяем, существует ли комната (создаётся при первой записи, но можно проверить)
        // Для инициализации можно сразу записать пустое значение или просто начать слушать
        
        // 6. Загружаем последние сообщения
        messagesRef.orderByKey().limitToLast(50).once('value', (snapshot) => {
            const messages = snapshot.val();
            if (messages) {
                const sorted = Object.entries(messages).sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));
                sorted.forEach(([id, msg]) => {
                    addMessageToChat(msg, id);
                });
            }
            chatArea.scrollTop = chatArea.scrollHeight;
            console.log('Загружены сообщения из комнаты:', space);
        });
        
        // 7. Начинаем слушать новые сообщения
        messagesListener = messagesRef.on('child_added', (snapshot) => {
            const msg = snapshot.val();
            const msgId = snapshot.key;
            if (!document.querySelector(`[data-id="${msgId}"]`)) {
                addMessageToChat(msg, msgId);
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        });
        
        console.log('Успешно вошли в комнату:', space);
        return true;
    }

    async function sendToFirebase() {
        if (!currentUser || !currentSpace) {
            alert('Сначала выберите ник и пространство в меню (кнопка "Вход")');
            return false;
        }
        
        const text = inputField.value.trim();
        const hasText = text.length > 0;
        const hasFile = selectedFile !== null;
        
        if (!hasText && !hasFile) return false;
        
        if (editingId) {
            const msgElement = document.querySelector(`[data-id="${editingId}"]`);
            if (msgElement) {
                const bubble = msgElement.querySelector('.bubble');
                if (hasText) {
                    const imgTag = bubble.querySelector('img');
                    if (imgTag) {
                        bubble.innerHTML = `<div>${imgTag.outerHTML}</div><div>${escapeHtml(text)}</div>`;
                    } else {
                        bubble.textContent = text;
                    }
                }
                msgElement.dataset.cleanText = text;
                const timestampSpan = msgElement.querySelector('.timestamp');
                timestampSpan.innerHTML = `${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} Вы <span class="check-mark">✓</span>`;
                await messagesRef.child(editingId).update({ text: text, edited: true });
            }
            clearEdit();
            return true;
        }
        
        let imageUrl = null;
        if (hasFile) {
            try {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 6)}.${fileExt}`;
                const storageRef = storage.ref(`chat_images/${currentSpace}/${fileName}`);
                const uploadTask = await storageRef.put(selectedFile);
                imageUrl = await uploadTask.ref.getDownloadURL();
            } catch(e) {
                console.error('Ошибка загрузки фото:', e);
                alert('Не удалось загрузить фото');
                return false;
            }
        }
        
        const messageData = {
            userName: currentUser,
            text: text || '',
            timestamp: Date.now(),
            ...(imageUrl && { imageUrl: imageUrl }),
            ...(replyToId && { replyTo: replyToId, replyText: quoteText.textContent })
        };
        
        try {
            await messagesRef.push(messageData);
            clearQuote();
            removeFile();
            inputField.value = '';
            inputField.style.height = 'auto';
            return true;
        } catch(e) {
            console.error('Ошибка отправки:', e);
            alert('Не удалось отправить сообщение');
            return false;
        }
    }

    function applyFontSize(percent) {
        fontSizePercent = Math.min(150, Math.max(70, percent));
        const root = document.documentElement;
        const baseSize = 15;
        const newSize = (baseSize * fontSizePercent) / 100;
        root.style.setProperty('--bubble-font-size', newSize + 'px');
        document.querySelectorAll('.bubble').forEach(el => {
            el.style.fontSize = newSize + 'px';
        });
        inputField.style.fontSize = (16 * fontSizePercent / 100) + 'px';
        fontSizeDisplay.textContent = fontSizePercent + '%';
        localStorage.setItem('chat_font_size', fontSizePercent);
    }

    fontMinus.addEventListener('click', () => {
        applyFontSize(fontSizePercent - 5);
    });
    fontPlus.addEventListener('click', () => {
        applyFontSize(fontSizePercent + 5);
    });

    themeToggle.addEventListener('change', function() {
        document.body.classList.toggle('theme-gray', this.checked);
        localStorage.setItem('chat_theme_gray', this.checked);
    });

    document.querySelectorAll('.message-row').forEach(attachMessageHandlers);
    
    document.getElementById('loginBtn').onclick = () => {
        if (joinSpace()) toggleMenu();
    };
    
    sendBtn.onclick = () => sendToFirebase();
    
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            sendToFirebase();
        }
    });
    
    chatArea.addEventListener('click', function(e) {
        if (!e.target.closest('.message-actions') && !e.target.closest('.message-row')) closeAllActionMenus();
    });
    
    window.clearQuote = clearQuote;
    window.removeFile = removeFile;
    window.openPhotoViewer = openPhotoViewer;
    window.closePhotoViewer = closePhotoViewer;
    window.toggleMsgMenu = toggleMsgMenu;
    window.handleMessageAction = handleMessageAction;
    
    // Автовход
    const savedNick = localStorage.getItem('chat_nick');
    const savedSpace = localStorage.getItem('chat_space');
    if (savedNick && savedSpace) {
        nickInput.value = savedNick;
        spaceInput.value = savedSpace;
        joinSpace();
    }
    
    const savedFont = localStorage.getItem('chat_font_size');
    if (savedFont) {
        applyFontSize(parseInt(savedFont));
    } else {
        applyFontSize(100);
    }
    
    const savedTheme = localStorage.getItem('chat_theme_gray');
    if (savedTheme === 'true') {
        themeToggle.checked = true;
        document.body.classList.add('theme-gray');
    }
    
    console.log('Чат готов, Firebase подключён');
</script>
